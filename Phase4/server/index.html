<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NN Music Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08080f; overflow: hidden; }
    canvas { display: block; }
    #status {
      position: fixed; bottom: 12px; right: 14px;
      font: 12px monospace; color: rgba(255,255,255,0.25);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="viz"></canvas>
  <div id="status">connecting…</div>
  <script>
    // Override server URL if needed:
    // window.WS_URL = "ws://192.168.1.100:8765/ws";
  </script>
  <script src="ws_client.js"></script>
  <script>
    // Show connection status
    const statusEl = document.getElementById("status");
    const _origConnect = connect;
    document.addEventListener("DOMContentLoaded", () => {
      setInterval(() => {
        if (typeof ws !== "undefined") {
          const states = ["connecting","open","closing","closed"];
          statusEl.textContent = `ws: ${states[ws.readyState] || "?"}`;
        }
      }, 1000);
    });
  </script>
</body>
</html>
