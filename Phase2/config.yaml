# ─────────────────────────────────────────────────────────
#  Neural Network Music Visualizer – Phase 2
#  CNN-LSTM Emotion Model Configuration
# ─────────────────────────────────────────────────────────

emotions:
  classes: [happy, sad, calm, angry, energetic]
  num_classes: 5

dataset:
  # Point this at your audio folder. Expected layout:
  #   data/raw/<emotion>/*.mp3  (or .wav)
  # If using DEAM/EMOPIA, set use_synthetic: false
  raw_dir: data/raw
  processed_dir: data/processed
  use_synthetic: true          # generate synthetic data when no real audio exists
  synthetic_samples: 200       # samples per class for synthetic dataset
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  random_seed: 42

audio:
  sample_rate: 22050
  window_sec: 3.0
  overlap: 0.5
  min_duration_sec: 1.0

features:
  # Mel-spectrogram (primary CNN input)
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  f_min: 20.0
  f_max: 8000.0
  # Feature vector (secondary LSTM input from Phase 1 pipeline)
  use_feature_vector: true
  feature_dim: 289             # must match Phase 1 FeatureExtractor.output_dim

augmentation:
  enabled: true
  time_stretch_range: [0.85, 1.15]
  pitch_shift_range: [-2, 2]   # semitones
  noise_factor: 0.005
  spec_augment:
    freq_mask_param: 20        # max frequency bins to mask
    time_mask_param: 40        # max time steps to mask
    num_freq_masks: 2
    num_time_masks: 2

model:
  # CNN encoder
  cnn:
    in_channels: 1             # mono mel-spectrogram
    channels: [32, 64, 128]    # conv block output channels
    kernel_size: 3
    dropout: 0.3
  # LSTM temporal
  lstm:
    hidden_size: 256
    num_layers: 2
    bidirectional: true
    dropout: 0.4
  # Classifier head
  head:
    hidden_dim: 128
    dropout: 0.4

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  # LR scheduler
  scheduler: cosine            # cosine | step | plateau
  warmup_epochs: 3
  # Early stopping
  early_stopping_patience: 10
  early_stopping_metric: val_f1
  # Checkpointing
  checkpoint_dir: checkpoints
  save_best_only: true
  # Logging
  log_dir: logs
  log_every_n_steps: 10

evaluation:
  metrics: [accuracy, f1_weighted, f1_per_class, confusion_matrix]
  target_f1: 0.75              # minimum acceptable weighted F1
